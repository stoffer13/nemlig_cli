[project]
name = "nemlig-cli"
version = "0.1.0"
description = "CLI for nemlig.com grocery shopping"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "argcomplete>=3.0.0",
    # This fork ships server.py (MCP server) alongside the CLI, and
    # run_server.sh launches it with plain `uv run`, so fastmcp has to be a
    # core dependency rather than an extra.
    "fastmcp>=3.4.4",
]

[project.scripts]
nemlig = "nemlig_cli:main"
nemlig-mcp = "server:main"

# Packaged so `uv tool install` can put both commands on PATH.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["nemlig_cli.py", "server.py"]
